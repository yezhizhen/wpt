<!doctype html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="../resources/test-helper.js"></script>
<head>
  <title>dataURL image drag and drop between iframes</title>
  <style type="text/css">
    iframe {
      width: 160px;
      height: 160px;
      border-style: none;
    }
  </style>
</head>
<body>
  <p><iframe src="helper-drag-me-data-url-image.xhtml">XHTML with image</iframe></p>
  <p>Drag circle above to the box below. It should be copied to the box once you drop it there.</p>
  <p><iframe src="helper-drop-image-here.xhtml" id="iframe-2">XHTML with image</iframe></p>
  <script>
    async function test() {
      await new Promise(loaded => window.addEventListener("load", loaded));
      const dragIframe = document.querySelector('iframe');
      const dropIframe = document.getElementById('iframe-2');
      const dropInnerDoc = dropIframe.contentDocument || dropIframe.contentWindow.document;
      const div = dropInnerDoc.querySelector('div');

      function onDropCallBack(event) {
        const dragInnerDoc = dragIframe.contentDocument || dragIframe.contentWindow.document;
        const img = dragInnerDoc.querySelector('img');
        assert_equals(event.dataTransfer.getData('text/uri-list').replace(/\r\n$/, ''), img.src);
        assert_equals(div.querySelector('img').src, img.src);
        return true;
      }
      dragDropTest(dragIframe, div, onDropCallBack,
        'Dragging a dataURL image within an iframe to another iframe should copy it there', dropIframe);
    }
    test();
  </script>
</body>
</html>
